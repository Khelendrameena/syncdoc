services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syncdoc
      POSTGRES_PASSWORD: ${DB_PASSWORD:-syncdoc}
      POSTGRES_DB: syncdoc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdoc -d syncdoc"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build: ./server
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://syncdoc:${DB_PASSWORD:-syncdoc}@db:5432/syncdoc
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 4000
      FRONTEND_URL: http://localhost:8080
      SAVE_DEBOUNCE_MS: 2000
    ports:
      - "4000:4000"

  web:
    build: ./client
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
